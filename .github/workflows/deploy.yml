# Test, build and publish the simulator to GitHub Pages on every push to main.
# The deploy job only runs if the test suite passes, so a change that breaks
# the physics or the controllers never reaches the live site.

name: Test and deploy

on:
  push:
    branches: [main]
  workflow_dispatch: # also allow a manual run from the Actions tab

# Pages deployment needs permission to publish and to prove who is publishing.
permissions:
  contents: read
  pages: write
  id-token: write

# Never run two deploys at once; a newer push cancels an older one in progress.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # `npm ci` installs exactly what package-lock.json records.
      - run: npm ci
      - run: npm test
      - run: npm run build

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
